<!doctype html><html><head><meta charset=utf8><meta name=robots content="noindex,nofollow"><title>Parrilla</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Parrilla Forestal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<template id="app">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
/* Layout: estudio oscuro tipo mesa de diseño; dos iPhones lado a lado (historias / perfil), apilados con pestañas en móvil. Acento = color de la marca activa. */
:root{
  --ink:#0d0e10; --panel:#16181c; --line:#26292f; --mute:#8b9099; --paper:#f2f1ee;
  --accent:#d9ff5a;
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --ios:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--display);min-height:100%;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;
  background-image:radial-gradient(circle at 1px 1px,#ffffff10 1px,transparent 0);background-size:22px 22px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* top */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:3px}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:99px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;font-weight:600;font-size:14px;transition:border-color .2s,background .2s}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.chip.add{padding:5px;width:38px;justify-content:center}
.chip.add svg{width:18px;height:18px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:#0d0e10;overflow:hidden}
.tools{display:flex;gap:6px}
.tbtn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;transition:background .2s}
.tbtn svg{width:19px;height:19px}
.tbtn.on{background:var(--accent);color:var(--on-accent,#0d0e10);border-color:var(--accent)}

.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero h1{margin:0;font-weight:800;font-size:clamp(40px,8vw,92px);line-height:.9;letter-spacing:-.04em;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.meter{font-family:var(--mono);font-size:12px;color:var(--mute);display:flex;gap:14px;letter-spacing:.04em;text-transform:uppercase}
.meter b{color:var(--paper);font-weight:500}

.seg{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--paper);color:var(--ink)}

.stage{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;justify-items:center}
.stage::before{content:"";position:absolute;inset:10% 15%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 28%,transparent),transparent);filter:blur(40px);z-index:0;pointer-events:none;transition:background .6s}
.col{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0;width:100%}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* phone */
.phone{width:min(340px,100%);aspect-ratio:9/19.5;border-radius:56px;padding:10px;position:relative;
  background:linear-gradient(145deg,#4a4d52,#1c1d20 30%,#2b2d31 70%,#55585e);box-shadow:0 0 0 1.5px #000,0 40px 80px -20px #000c,inset 0 0 0 1px #ffffff22}
.phone::before{content:"";position:absolute;left:-3px;top:22%;width:3px;height:9%;border-radius:2px;background:#34363a}
.phone::after{content:"";position:absolute;right:-3px;top:28%;width:3px;height:13%;border-radius:2px;background:#34363a}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#000;font-family:var(--ios);isolation:isolate}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:31%;height:30px;border-radius:20px;background:#000;z-index:40}
.sb{height:50px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-weight:600;font-size:15px;position:relative;z-index:30;flex:none}
.sb .ico{display:flex;gap:5px;align-items:center}
.sb svg{height:12px;width:auto}

/* story */
.story{position:absolute;inset:0;background:#000;color:#fff;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.smedia{position:absolute;top:50px;left:0;right:0;aspect-ratio:9/16;overflow:hidden;border-radius:10px;background:#111}
.smedia img,.smedia video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.smedia.in-l{animation:inL .35s cubic-bezier(.2,.8,.2,1)}
.smedia.in-r{animation:inR .35s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{transform:translateX(40%) scale(.92);opacity:.2}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-40%) scale(.92);opacity:.2}to{transform:none;opacity:1}}
.sgrad{position:absolute;inset:0;background:linear-gradient(#0008,transparent 22%,transparent 80%,#0007);pointer-events:none;border-radius:10px;inset:50px 0 auto;aspect-ratio:9/16}
.story .sb{position:absolute;inset:0 0 auto;color:#fff}
.bars{position:absolute;top:58px;left:10px;right:10px;display:flex;gap:3px;z-index:5}
.bars i{flex:1;height:2.5px;border-radius:2px;background:#ffffff55;overflow:hidden}
.bars b{display:block;height:100%;width:0;background:#fff}
.shead{position:absolute;top:68px;left:12px;right:10px;display:flex;align-items:center;gap:8px;z-index:5;font-size:13.5px}
.shead .av{width:32px;height:32px}
.shead .h{font-weight:600}
.shead .t{opacity:.7}
.shead .sp{flex:1}
.shead button{width:30px;height:30px;display:grid;place-items:center}
.shead svg{width:20px;height:20px}
.sfoot{position:absolute;bottom:16px;left:14px;right:14px;display:flex;align-items:center;gap:14px;z-index:5}
.reply{flex:1;border:1px solid #ffffffaa;border-radius:99px;padding:11px 16px;font-size:13.5px;opacity:.9}
.sfoot svg{width:24px;height:24px}
/* revisión de mercadeo: la caja «Enviar mensaje» es el comentario de esa historia; ♥ aprueba, ✈ pide ajuste */
.sfoot.rv{align-items:flex-end}
.sfoot textarea.reply{display:block;min-width:0;margin:0;height:42px;background:transparent;color:#fff;font:inherit;font-size:13.5px;line-height:1.35;resize:none;outline:none;overflow-y:auto;scrollbar-width:none;border-radius:21px;box-sizing:border-box;opacity:1;user-select:text;-webkit-user-select:text;transition:border-color .2s,background .2s}
.sfoot textarea.reply::placeholder{color:#ffffffc4}
.sfoot textarea.reply:focus{border-color:#fff;background:#ffffff0d}
.sfoot textarea.reply[readonly]{cursor:pointer}
.sfoot.aj textarea.reply{border-color:#f5b445;background:#f5b44517}
.sfoot.okc textarea.reply{border-color:color-mix(in srgb,var(--accent) 75%,#fff)}
.rv-b{flex:none;width:32px;height:32px;margin-bottom:5px;display:grid;place-items:center;color:#fff;text-decoration:none;cursor:pointer;transition:opacity .2s,transform .15s}
.rv-b:active{transform:scale(.86)}
.rv-b.on svg{fill:#ff3040;stroke:#ff3040}
.rv-b.on{animation:latir .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes latir{40%{transform:scale(1.28)}}
.rv-b.apag{opacity:.4}
.rv-bar{position:absolute;left:0;right:0;bottom:calc(100% + 8px);display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:#ffffffe0;text-shadow:0 1px 3px #000c}
.rv-bar:empty{display:none}
.rv-bar .sp{flex:1}
.rv-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;background:#ffffff2b;color:#fff;text-shadow:none}
.rv-bar svg{width:11px;height:11px;stroke-width:2.6;display:inline-block;vertical-align:-1px}
.rv-chip.aj{background:#f5b445;color:#1d1300}
.rv-chip.ok{background:var(--accent);color:var(--on-accent,#0d0e10)}
.rv-chip.ok svg{stroke-width:3.2}
.rv-chip.nuevo{background:#000a;border:1px dashed #f5b445;color:#f5b445}
.rv-bar button{padding:3px 9px;border-radius:99px;background:#ffffff26;color:#fff;font:inherit;text-shadow:none}
.rv-bar button.rojo{background:#ff4d4d}
.rv-hint{opacity:0;transition:opacity .2s}
.sfoot:focus-within .rv-hint{opacity:1}
.shead .sok{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent,#0d0e10);display:grid;place-items:center;flex:none;box-shadow:0 1px 4px #0006;animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
.shead .sok svg{width:13px;height:13px;stroke-width:3.2}
.ptag{display:none!important;position:absolute;top:100px;right:12px;z-index:5;font:600 11px var(--mono);letter-spacing:.06em;padding:5px 9px;border-radius:99px;background:var(--accent);color:var(--on-accent,#0d0e10);display:flex;gap:4px;align-items:center}
.ptag svg{width:12px;height:12px}
.ptag.draft{background:#000a;color:#fff;border:1px solid #fff4}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px;color:#fff;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent) 22%,#111),#050505 70%)}
.empty .big{width:76px;height:76px;border-radius:50%;border:1.5px dashed #ffffff66;display:grid;place-items:center;transition:transform .2s}
.empty .big:hover{transform:scale(1.06)}
.empty .big svg{width:30px;height:30px}
.empty .sb{position:absolute;inset:0 0 auto;width:100%;box-sizing:border-box}
.empty p{margin:0;font-size:14px;opacity:.7;max-width:20ch}

/* dock */
.dock{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px;flex-wrap:wrap;justify-content:center}
.db{height:42px;min-width:42px;padding:0 11px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--paper);transition:background .15s,color .15s}
.db:hover{background:#ffffff10}
.db svg{width:19px;height:19px}
.db.pri{background:var(--accent);color:var(--on-accent,#0d0e10)}
.db.ok{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-ink,var(--accent))}
.db.danger{background:#ff4d4d;color:#fff}
.db[disabled]{opacity:.3;pointer-events:none}
a.db{text-decoration:none}
.db.wa{background:#25d366;color:#04120a}
.hint{font-size:13px;color:var(--mute);padding:0 12px;display:flex;align-items:center;min-height:42px}
.tbtn{position:relative}
.tbtn.pend::after{content:"";position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}
.sep{width:1px;background:var(--line);margin:6px 2px}
.thumbs{display:flex;gap:6px;max-width:min(340px,100%);overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.thumbs::-webkit-scrollbar{display:none}
.th{flex:none;width:38px;aspect-ratio:9/16;border-radius:7px;overflow:hidden;border:1.5px solid transparent;position:relative}
.th.on{border-color:var(--accent)}
.th img,.th video{width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:.45;transition:opacity .2s}
.th.on img,.th.on video{opacity:1}
.th .tb{position:absolute;right:2px;bottom:2px;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 1.5px #000}
.th .tb svg{width:10px;height:10px;stroke-width:3.4}
.th .tb.ok{background:var(--accent);color:var(--on-accent,#0d0e10)}
.th .tb.aj{background:#f5b445;color:#1d1300}

/* instagram profile */
.ig{--bg:#fff;--fg:#000;--sub:#737373;--btn:#efefef;--sep:#dbdbdb;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
.ig.dark{--bg:#000;--fg:#f5f5f5;--sub:#a8a8a8;--btn:#262626;--sep:#262626}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.itop{display:flex;align-items:center;gap:4px;padding:2px 14px 8px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.itop .h{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itop .h svg{width:16px;height:16px;flex:none}
.itop .sp{flex:1}
.itop>svg{width:25px;height:25px;margin-left:16px;flex:none}
.ihead{display:flex;align-items:center;gap:18px;padding:6px 14px 10px}
.ring{width:84px;height:84px;border-radius:50%;padding:3px;flex:none;background:transparent}
.ring.live{background:conic-gradient(from 210deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
.ring .av{width:100%;height:100%;border:3px solid var(--bg);font-size:26px}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center;font-size:12.5px;min-width:0}
.stats b{display:block;font-size:16px;font-weight:700}
.bio{padding:0 14px;font-size:13.5px;line-height:1.35;white-space:pre-line;overflow-wrap:anywhere}
.bio .n{font-weight:600}
.bio .l{color:#00376b;font-weight:600}
.ig.dark .bio .l{color:#e0f1ff}
.ibtns{display:flex;gap:6px;padding:12px 14px}
.ibtns span{flex:1;text-align:center;background:var(--btn);border-radius:8px;padding:7px 0;font-weight:600;font-size:13px}
.tabs{display:flex;border-top:1px solid var(--sep);position:sticky;top:0;background:var(--bg);z-index:3}
.tabs span{flex:1;display:flex;justify-content:center;padding:10px 0;color:var(--sub);border-top:1px solid transparent;margin-top:-1px}
.tabs span.on{color:var(--fg);border-color:var(--fg)}
.tabs svg{width:23px;height:23px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding-bottom:4px}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--btn);display:block;width:100%}
.r11 .tile{aspect-ratio:1/1}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block;transition:transform .4s}
.tile:hover img,.tile:hover video{transform:scale(1.04)}
.tile .kind{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 2px #0008)}
.tile .kind svg{width:17px;height:17px}
.tile .ok{position:absolute;left:5px;bottom:5px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent,#0d0e10);display:grid;place-items:center;box-shadow:0 1px 4px #0006}
.tile .ok svg{width:12px;height:12px;stroke-width:3}
.tile.ghost{background:transparent;border:1.5px dashed var(--sep);color:var(--sub);display:grid;place-items:center}
.tile.ghost svg{width:22px;height:22px}
.tile.ghost.ex{border:0;background:var(--btn)}
.tile.ghost.ex i{position:absolute;inset:0;opacity:.75}
.tile.ghost.ex em{position:absolute;bottom:6px;left:6px;font:500 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;font-style:normal;color:#fff;opacity:.85}
.tile.fresh{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.nav{display:flex;justify-content:space-around;align-items:center;padding:10px 0 26px;border-top:1px solid var(--sep);background:var(--bg);flex:none}
.nav svg{width:24px;height:24px}
.nav .av{width:26px;height:26px;border:2px solid var(--fg);font-size:10px}

/* post detail overlay */
.post{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.post.open{transform:none}
.ptop{display:flex;align-items:center;gap:10px;padding:0 12px 8px;flex:none}
.ptop button{width:32px;height:32px;display:grid;place-items:center}
.ptop svg{width:24px;height:24px}
.ptop div{flex:1;text-align:center;font-weight:700;font-size:16px;margin-right:42px;line-height:1.1}
.ptop small{display:block;font-weight:600;font-size:12px;color:var(--sub)}
.phd{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:13.5px;font-weight:600}
.phd .av{width:32px;height:32px}
.phd .sp{flex:1}
.phd svg{width:20px;height:20px}
.car{position:relative;overflow:hidden;background:#111;aspect-ratio:4/5;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.track>*{flex:0 0 100%;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cnt{position:absolute;top:10px;right:10px;background:#000a;color:#fff;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px}
.carr{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:#fffd;color:#000;display:grid;place-items:center;box-shadow:0 1px 4px #0004}
.carr svg{width:16px;height:16px;stroke-width:2.5}
.carr.l{left:8px}.carr.r{right:8px}
.pact{display:flex;align-items:center;gap:14px;padding:10px 12px 6px}
.pact svg{width:24px;height:24px}
.pact .sp{flex:1;display:flex;justify-content:center;gap:4px}
.pact .sp i{width:6px;height:6px;border-radius:50%;background:var(--sep)}
.pact .sp i.on{background:#0095f6}
.cap{padding:0 12px 20px;font-size:13.5px;line-height:1.4}
.cap b{font-weight:600}
.cap textarea{width:100%;border:0;background:transparent;color:var(--fg);font:inherit;resize:none;padding:2px 0 0;min-height:60px;outline:none;field-sizing:content}
.cap textarea::placeholder{color:var(--sub)}
.cap .date{color:var(--sub);font-size:11.5px;margin-top:6px}

/* sheet */
.veil{position:fixed;inset:0;background:#000a;backdrop-filter:blur(6px);z-index:60;display:grid;place-items:center;padding:16px}
.sheet{width:min(440px,100%);max-height:90%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.sheet h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}
.fr{display:flex;gap:14px;align-items:center}
.fr .av{width:64px;height:64px;font-size:22px;cursor:pointer}
label.f{display:flex;flex-direction:column;gap:5px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);flex:1;min-width:0}
label.f input,label.f textarea{font:400 15px var(--display);color:var(--paper);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-transform:none;letter-spacing:0;width:100%;box-sizing:border-box}
label.f textarea{resize:vertical;min-height:72px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw button.on{border-color:var(--paper)}
.row2{display:flex;gap:10px}
.sheet .acts{display:flex;gap:8px;justify-content:space-between;margin-top:4px}
.sheet .acts .db{border:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--paper);color:var(--ink);font-weight:600;font-size:14px;padding:11px 18px;border-radius:99px;z-index:80;transition:all .3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

.fmt-sub{margin:-6px 0 0;color:var(--mute);font-size:14px}

function pgEnviar(){if(!PG)return;clearTimeout(pgT);pgT=setTimeout(pgFlush,600)}
async function pgFlush(){
  if(!PG)return;if(pgBusy)return pgEnviar();pgBusy=true;const L=rl();let fallo=false,n=0;
  for(const id of Object.keys(L)){const e=L[id];if(e.env)continue;const p=S.posts.find(x=>x.id===id);if(!p)continue;const at=e.at;
    try{const r=await fetch(pgUrl,{method:'POST',body:JSON.stringify({t:'rev',id,v:e.v||'',c:(e.c||'').slice(0,1500),at,por:PG.autor||'Mercadeo'})});if(!r.ok)throw 0;
      if(L[id]&&L[id].at===at){L[id].env=Date.now();rlSave();n++}pgAvisar(p,e)}catch(err){fallo=true}}

function pgAplicar(ev){
  if(!ev||ev.t!=='rev'||!ev.id||!ev.at)return false;const p=S.posts.find(x=>x.id===ev.id);if(!p)return false;
  const s=srvDe(p),mio=rl()[p.id];
  if(mio&&mio.at>=ev.at)return false;
  if(Math.max(s.comentarioAt||0,p.respuestaAt||0,p.revAt||0,p.mkAt||0)>=ev.at)return false;

}
async function pgEscuchar(){
  if(!PG)return;
  try{const t=await(await fetch(pgUrl+'/json?poll=1&since=12h')).text();let ch=false;
    for(const ln of t.split('\n')){if(!ln.trim())continue;try{const m=JSON.parse(ln);if(m.event==='message')ch=pgAplicar(JSON.parse(m.message))||ch}catch(e){}}
    if(ch){rlSave();render()}}catch(e){}
  try{new EventSource(pgUrl+'/sse').onmessage=e=>{try{if(pgAplicar(JSON.parse(JSON.parse(e.data).message))){rlSave();render()}}catch(err){}}}catch(e){}
  pgFlush();
}

// Escritura optimista: pinta el cambio al instante y lo deshace si la db lo rechaza
async function guardarRev(p,patch){
  if(devMode()){srvDe(p);Object.assign(p,patch);rl()[p.id]={v:p.status==='draft'?'':p.status||'',c:p.comentario||'',at:Date.now()};rlSave();pgEnviar();render();return true}
  if(S.canEdit&&'status' in patch&&!('revAt' in patch))patch.revAt=Date.now();
  const viejo={};for(const k in patch)viejo[k]=p[k];
  Object.assign(p,patch);render();
  try{await upd('posts',p.id,patch);return true}
  catch(e){Object.assign(p,viejo);
    if(e?.code==='invalid_argument'&&S.cloud&&!S.canEdit&&!S.soloLectura){S.soloLectura=true;return guardarRev(p,patch)} // cuenta de solo lectura: queda en este navegador
    else toast(e?.code==='revoked'?'Se cerró el acceso a la parrilla. Recarga la página.':'No se pudo guardar. Revisa la conexión e intenta otra vez.');
    render();return false}
}

  bor.set(p.id,'');rvEdit=null;renderRev();verRev(p);

  return ms.map(m=>{const mio=(m.de==='m')===yoM;
    const est=m.de==='m'&&modoRev()==='dev'?(p._env?'enviado a David':faltaTxt()):m.at?haceRev(m.at):'';

function textoRevision(){
  const b=brand(),ps=piezas(),ok=ps.filter(p=>p.status==='ok'),aj=ps.filter(p=>p.status==='ajuste'),no=ps.filter(p=>!revisada(p));
  const ln=p=>`${nomP(p)} #${tagP(p)}${p.comentario?': '+p.comentario.trim().replace(/\s*\n+\s*/g,' ⏎ '):''}`;
  return[`Revisión de la parrilla · ${b?.name||''}`,`${ok.length+aj.length} de ${ps.length} piezas revisadas`,
    aj.length?'\n✏️ CON AJUSTE\n'+aj.map(ln).join('\n'):'',ok.length?'\n✅ APROBADAS\n'+ok.map(ln).join('\n'):'',no.length?'\n⏳ SIN REVISAR\n'+no.map(ln).join('\n'):''].filter(Boolean).join('\n');
}
function leerRevision(txt){
  let sec=null;const out=[];
  for(const raw of String(txt||'').split(/\r?\n/)){const ln=raw.trim(),m=/#([a-z0-9]{6})(?::\s*(.*))?$/i.exec(ln);
    if(!m){if(/CON AJUSTE/i.test(ln))sec='ajuste';else if(/APROBADAS/i.test(ln))sec='ok';else if(/SIN REVISAR/i.test(ln))sec='draft';continue}
    if(sec)out.push({tag:m[1],v:sec,c:(m[2]||'').replace(/\s*⏎\s*/g,'\n').trim()})}
  return out;
}

<script>/* Adaptador de nube: fuera de Claude, le da a la página el mismo `window.claude` que usa dentro del artifact

(()=>{const CFG=window.PARRILLA_PAGES;if(!CFG||!CFG.api)return;const API=CFG.api;

  async function write(c,id,fn,local){const k=c+'/'+id;dirty[k]=(dirty[k]||0)+1;local();emit(c);
    try{const r=await fn();if(r&&r.v){ver[k]=r.v;if('d' in r)poner(c,id,r.d)}return r}
    catch(e){try{const r=await req('GET',`/api/docs/${c}/${id}`);ver[k]=r.v;poner(c,id,r.d)}catch(_){}throw e}
    finally{if(!--dirty[k]){delete dirty[k];emit(c)}}}
  const rid=()=>{const a='abcdefghijklmnopqrstuvwxyz0123456789';return[...crypto.getRandomValues(new Uint8Array(20))].map(b=>a[b%36]).join('')};
  const pieza=(c,id)=>{try{if(c!=='posts'||CLAVE)return{};const p=S.posts.find(x=>x.id===id);return{'x-pieza':encodeURIComponent(nomP(p)+' · '+(brand()?.name||''))}}catch(e){return{}}};
  const db={collection:c=>({
    onSnapshot(ok){(subs[c]=subs[c]||[]).push(ok);if(last>=0)setTimeout(()=>emit(c),0);return()=>{}},
    add:async data=>{const id=rid();await write(c,id,()=>req('PUT',`/api/docs/${c}/${id}`,data),()=>col(c).set(id,{...data}));return{id}},
    doc:id=>({
      update:p=>write(c,id,()=>req('PATCH',`/api/docs/${c}/${id}`,p,pieza(c,id)),()=>{const d=col(c).get(id);if(!d)return;const n={...d};for(const k in p){if(p[k]===null)delete n[k];else n[k]=p[k]}col(c).set(id,n)}),
      set:async d=>{if(c==='prev'&&d&&/^data:/.test(d.d||'')){await req('PUT','/api/prev/'+id,await(await fetch(d.d)).blob());d={...d,d:API+'/p/'+id}}
        return write(c,id,()=>req('PUT',`/api/docs/${c}/${id}`,d),()=>col(c).set(id,{...d}))},
      delete:()=>write(c,id,()=>req('DELETE',`/api/docs/${c}/${id}`),()=>col(c).delete(id))})})};
  const assets={upload:async(blob,o)=>{const r=await fetch(API+'/api/assets',{method:'POST',headers:H({'content-type':(o&&o.type)||blob.type||'application/octet-stream'}),body:blob});if(!r.ok)falla(r);return r.json()},
    delete:id=>req('DELETE','/api/assets/'+id),uso:()=>req('GET','/api/uso')};
  const downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}};
  const user={isOwner:async()=>(await yo).owner,canEdit:async()=>(await yo).owner,can:async()=>true};
  window.claude={use:async n=>{const o=(await yo).owner;if(n==='db'){start();return db}return n==='assets'?(o?assets:null):n==='downloads'?downloads:n==='user'?user:null}};
})();
</script>
<script id="boot">(()=>{const t=document.getElementById('app');const f=document.importNode(t.content,true);const ss=[...f.querySelectorAll('script')];ss.forEach(x=>x.remove());const h=document.body||document.documentElement;h.appendChild(f);ss.forEach(x=>{const n=document.createElement('script');n.textContent=x.textContent;h.appendChild(n)})})();</script>
